name: Verificacion estructural
on:
  push:
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Comprobar estructura y sintaxis
        run: python -m unittest discover -s tests -v
